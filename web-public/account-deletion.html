<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب حذف الحساب | طيور الرشيدي</title><style>body{font-family:Arial,sans-serif;max-width:680px;margin:40px auto;padding:0 20px;color:#17283f;line-height:1.8}h1{color:#123b79}input,button{font:inherit;padding:12px;border-radius:10px}input{width:100%;box-sizing:border-box;border:1px solid #ccd5e2;margin:12px 0}button{border:0;background:#174a9c;color:white;cursor:pointer}#result{margin-top:14px}</style></head>
<body><h1>طلب حذف الحساب</h1><p>أدخل البريد الإلكتروني المستخدم في حساب طيور الرشيدي. سنراجع الطلب ونتواصل للتحقق من ملكيتك قبل حذف الملف والعناوين والتفضيلات وإزالة بيانات التعريف من سجلات الطلبات التي يلزم الاحتفاظ بها.</p><form id="form"><label for="email">البريد الإلكتروني</label><input id="email" name="email" type="email" autocomplete="email" required><button type="submit">إرسال طلب الحذف</button></form><p id="result" role="status"></p><p><a href="/privacy-policy.html">سياسة الخصوصية</a></p><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const result=document.getElementById('result');result.textContent='جارٍ إرسال الطلب…';try{const response=await fetch('/api/account-deletion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const body=await response.json();if(!response.ok)throw new Error(body.error||'تعذر إرسال الطلب.');result.textContent=body.message}catch(error){result.textContent=error.message||'تعذر إرسال الطلب. حاول مرة أخرى.'}});</script></body></html>
